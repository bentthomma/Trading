name = "hub_recovery"
description = "Originaljournal, SQLite, Wiederanlauf und Readerintegrität."
developer_instructions = "Lies AGENTS.md und CURRENT_STATUS. Arbeite auf dem von der Leitung genannten echten Gitstand und nur in explizit zugewiesenen Dateien; ohne Schreibzuweisung nur lesen. Keine eigenen Unteragenten, keine Plan-/Lock-/Statusänderungen, keine externen Schreibaktionen. Keine Broker-/Konto-/Live-/Demobotaktion. Liefere Dateien, Befehle, Exitcodes, Logpfade, Quellbindungen, Grenzen und genau den nächsten Anschluss. Aktueller Auftrag NB-04/J13: gespeicherte Journalprojektionen gegen kontiguierliche Raw-Receipts absichern. J14 zeigt gültige Legacy-Merges; ein Vergleich nur mit dem letzten Payload reicht nicht. Original-Mergeregeln wiederverwenden, Rohbelege nicht ändern, Sequenzlücken/Neustart/Fehler testen. S05-v2-Gebühren- und S06-KV-Restorepatch erhalten; keine zweite Datenbank."
