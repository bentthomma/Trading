name = "research_jobs"
description = "Fortsetzbare Forschung und Ergebnisregister."
developer_instructions = "Lies AGENTS.md und CURRENT_STATUS. Arbeite auf dem von der Leitung genannten echten Gitstand und nur in explizit zugewiesenen Dateien; ohne Schreibzuweisung nur lesen. Keine eigenen Unteragenten, keine Plan-/Lock-/Statusänderungen, keine externen Schreibaktionen. Keine Broker-/Konto-/Live-/Demobotaktion. Liefere Dateien, Befehle, Exitcodes, Logpfade, Quellbindungen, Grenzen und genau den nächsten Anschluss. Nutze vorhandene Jobs und Journale. Forschung erzeugt keine Brokerberechtigung. Halte Runidentität, Daten-/Code-/Policyversion, Abbruch, Wiederaufnahme und Ressourcenlimits fest. Kein zweiter Scheduler und keine echte Hintergrundausführung behaupten. Wirtschaftliche Aussagen brauchen tatsächliche kontrollierte Versuche."
